<body class="login-page"
  style="background: linear-gradient(135deg, #ff5f6d, #ffc371); height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="login-box text-center">

    <!-- Logo / Image -->
    <div class="login-logo mb-4">
      <!-- <img src="assets/img/logo.png" alt="DevTinder Logo" 
           style="width: 100px; height: 100px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"> -->
      <h2 style="font-weight: bold; color: white; margin-top: 10px;">
          <i class="fas fa-fire"></i> Dev<span class="text-dark">Tinder</span>
      </h2>
    </div>

    <!-- Card -->
    <div class="card"
      style="border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); background: rgba(255,255,255,0.95);">
      <div class="card-body login-card-body" style="border-radius: 20px;">
        <p class="login-box-msg" style="font-size: 1.2rem; font-weight: 500;">Login</p>

        <form action="#" method="post">
          <div class="input-group mb-3">
            <input type="email" class="form-control" placeholder="Email" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-envelope"></span>
              </div>
            </div>
          </div>

          <div class="input-group mb-3">
            <input type="password" class="form-control" placeholder="Password" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock"></span>
              </div>
            </div>
          </div>

          <div class="text-center mb-3">
            <button type="submit" class="btn btn-primary btn-block"
              style="border-radius: 10px; background: linear-gradient(135deg, #ff5f6d, #ffc371); border: none; font-weight: bold;" (click)="login()">
              Sign In
            </button>
          </div>
        </form>

        <p class="mb-1">
          <a href="forgot-password.html" style="color: #ff5f6d;">I forgot my password</a>
        </p>
        <p class="mb-0">
          <a href="signUp" class="text-center" style="color: #ff5f6d;">Register a new membership</a>
        </p>
      </div>
    </div>
  </div>
</body>
